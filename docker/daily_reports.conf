[program:daily-reports-scheduler]
command=/usr/local/bin/php /app/console send:daily-reports
user=nobody
autorestart=true
redirect_stderr=true
stdout_logfile=/app/storage/logs/daily_reports_supervisor.log
starttime=3600

# Используется с cron-контейнером или встроенным cron
# Этот файл - альтернатива crontab для Docker
